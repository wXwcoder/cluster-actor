syntax = "proto3";

package gen;

option go_package = "github.com/cluster-actor/server/gen;gen";

import "error.proto";



// ChatMessage 聊天消息结构
message ChatMessage {
  string MsgId = 1;                     // 消息ID
  int64 SenderId = 2;                   // 发送者用户ID
  string SenderName = 3;                // 发送者名称
  string RoomId = 4;                    // 房间ID
  ChatMsgType Type = 5;             // 消息类型
  string Content = 6;                   // 消息内容
  int64 Timestamp = 7;                  // 时间戳（毫秒）
}

// UserInfo 用户信息结构
message ChatUserInfo {
  int64 UserId = 1;                     // 用户ID
  string Username = 2;                  // 用户名
  bool IsOnline = 3;                    // 是否在线
  string CurrentRoomId = 4;             // 当前所在房间ID
  int64 LoginTime = 5;                  // 登录时间戳
}

// RoomInfo 房间信息结构
message ChatRoomInfo {
  string RoomId = 1;                    // 房间ID
  string RoomName = 2;                  // 房间名称
  string CreatorName = 3;               // 创建者名称
  int64 CreatorId = 4;                  // 创建者ID
  int32 MaxMembers = 5;                 // 最大成员数
  int32 CurrentMembers = 6;             // 当前成员数
  int64 CreatedAt = 7;                  // 创建时间戳
}

// LoginReq 用户登录请求
message ChatLoginReq {
  int64 UserId = 1;                     // 用户ID
  string Username = 2;                  // 用户名
  string SessionId = 3;                 // WebSocket会话ID
}

// LoginResp 用户登录响应
message ChatLoginResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
  ChatUserInfo User = 3;                    // 用户信息
}

// LogoutReq 用户登出请求
message ChatLogoutReq {
  int64 UserId = 1;                     // 用户ID
  string SessionId = 2;                 // WebSocket会话ID
}

// LogoutResp 用户登出响应
message ChatLogoutResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
}

// UserMessage 发送给用户的消息（内部使用）
message ChatUserMessage {
  ChatMessage Message = 1;              // 聊天消息
}

// GetUserInfoReq 获取用户信息请求
message ChatGetUserInfoReq {
  int64 UserId = 1;                     // 用户ID
}

// GetUserInfoResp 获取用户信息响应
message ChatGetUserInfoResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
  ChatUserInfo User = 3;                    // 用户信息
}

// CreateRoomReq 创建房间请求
message ChatCreateRoomReq {
  string RoomName = 1;                  // 房间名称
  int64 CreatorId = 2;                  // 创建者ID
  string CreatorName = 3;               // 创建者名称
  int32 MaxMembers = 4;                 // 最大成员数（默认50）
}

// CreateRoomResp 创建房间响应
message ChatCreateRoomResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
  ChatRoomInfo Room = 3;                    // 房间信息
}

// JoinRoomReq 加入房间请求
message ChatJoinRoomReq {
  string RoomId = 1;                    // 房间ID
  int64 UserId = 2;                     // 用户ID
  string Username = 3;                  // 用户名
}

// JoinRoomResp 加入房间响应
message ChatJoinRoomResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
  ChatRoomInfo Room = 3;                    // 房间信息
  repeated ChatMessage RecentMessages = 4; // 最近消息列表
}

// LeaveRoomReq 离开房间请求
message ChatLeaveRoomReq {
  string RoomId = 1;                    // 房间ID
  int64 UserId = 2;                     // 用户ID
  string Username = 3;                  // 用户名
}

// LeaveRoomResp 离开房间响应
message ChatLeaveRoomResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
}

// SendMessageReq 发送消息请求
message ChatSendMessageReq {
  string RoomId = 1;                    // 房间ID
  int64 SenderId = 2;                   // 发送者ID
  string SenderName = 3;                // 发送者名称
  string Content = 4;                   // 消息内容
  ChatMsgType Type = 5;             // 消息类型
}

// SendMessageResp 发送消息响应
message ChatSendMessageResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
  ChatMessage MessageData = 3;          // 发送的消息
}

// GetRoomInfoReq 获取房间信息请求
message ChatGetRoomInfoReq {
  string RoomId = 1;                    // 房间ID
}

// GetRoomInfoResp 获取房间信息响应
message ChatGetRoomInfoResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
  ChatRoomInfo Room = 3;                    // 房间信息
}

// GetRoomUsersReq 获取房间用户列表请求
message ChatGetRoomUsersReq {
  string RoomId = 1;                    // 房间ID
}

// GetRoomUsersResp 获取房间用户列表响应
message ChatGetRoomUsersResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
  repeated ChatUserInfo Users = 3;          // 用户列表
}

// GetMessagesReq 获取历史消息请求
message ChatGetMessagesReq {
  string RoomId = 1;                    // 房间ID
  int32 Limit = 2;                      // 消息数量限制
  int64 BeforeTimestamp = 3;            // 获取此时间戳之前的消息
}

// GetMessagesResp 获取历史消息响应
message ChatGetMessagesResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
  repeated ChatMessage Messages = 3;    // 消息列表
}

// GetRoomListReq 获取房间列表请求
message ChatGetRoomListReq {
  int32 Page = 1;                       // 页码
  int32 PageSize = 2;                   // 每页数量
}

// GetRoomListResp 获取房间列表响应
message ChatGetRoomListResp {
  ErrorCode Code = 1;                   // 错误码
  string Message = 2;                   // 消息
  repeated ChatRoomInfo Rooms = 3;          // 房间列表
  int32 Total = 4;                      // 总房间数
}
