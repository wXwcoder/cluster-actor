# 集群配置
cluster_name: "cluster-actor"
node_name: "node-1"
host: "127.0.0.1"
port: 8081
log_level: "debug"
health_check_port: 8181

# Consul服务发现配置
consul:
  address: "127.0.0.1:8500"
  scheme: "http"
  datacenter: "dc1"
  token: ""
  cache_prefix: "g"
  ttl_heartbeat_interval: 10
  deregister_critical_service_after: 30

# Actor系统配置
actor:
  max_grain_count: 10000
  activation_timeout: 3000
  idle_timeout: 30
  remote_call_timeout: 5000

# 链路追踪配置
tracing:
  enabled: true
  type: "zipkin" #jaeger or zipkin
  endpoint: "http://localhost:9411/api/v2/spans"
  sample_ratio: 1.0