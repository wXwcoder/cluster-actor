<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="chat-page">
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-left">
            <h1 class="logo">聊天室</h1>
            <span id="connectionStatus" class="connection-status disconnected">未连接</span>
        </div>
        <div class="header-right">
            <span id="userInfo" class="user-info"></span>
            <button id="logoutBtn" class="btn btn-secondary btn-sm">退出登录</button>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 左侧房间列表 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>房间列表</h2>
                <button id="createRoomBtn" class="btn btn-primary btn-sm">创建房间</button>
            </div>
            <div id="roomList" class="room-list">
                <!-- 房间列表项将通过JS动态添加 -->
            </div>
        </aside>

        <!-- 中间聊天区域 -->
        <section class="chat-area">
            <div id="chatHeader" class="chat-header">
                <h3 id="currentRoomName">选择一个房间</h3>
                <span id="roomUserCount" class="room-user-count"></span>
            </div>
            <div id="messageList" class="message-list">
                <!-- 消息将通过JS动态添加 -->
            </div>
            <div id="messageInput" class="message-input">
                <input type="text" id="messageText" placeholder="输入消息..." maxlength="500">
                <button id="sendBtn" class="btn btn-primary">发送</button>
            </div>
        </section>

        <!-- 右侧在线用户列表 -->
        <aside class="user-sidebar">
            <div class="sidebar-header">
                <h2>在线用户</h2>
            </div>
            <div id="userList" class="user-list">
                <!-- 用户列表将通过JS动态添加 -->
            </div>
        </aside>
    </main>

    <!-- 创建房间模态框 -->
    <div id="createRoomModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>创建新房间</h3>
                <button class="close-btn" onclick="closeCreateRoomModal()">&times;</button>
            </div>
            <form id="createRoomForm" class="modal-form">
                <div class="form-group">
                    <label for="roomName">房间名称</label>
                    <input type="text" id="roomName" name="roomName" required 
                           placeholder="请输入房间名称" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="maxMembers">最大人数</label>
                    <input type="number" id="maxMembers" name="maxMembers" required 
                           placeholder="请输入最大人数" min="2" max="50" value="20">
                </div>
                <button type="submit" class="btn btn-primary btn-block">创建</button>
            </form>
        </div>
    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
